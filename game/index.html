<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5edde">
  <meta name="description" content="Find seven differences in a lantern-lit night market.">
  <title>Lantern Lane: Spot the Difference</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game" data-phase="title">
    <header class="masthead">
      <div class="identity">
        <svg class="seal" viewBox="0 0 54 64" aria-hidden="true">
          <rect x="1" y="1" width="52" height="62" rx="9" fill="none" stroke="currentColor"/>
          <rect x="5" y="5" width="44" height="54" rx="6" fill="currentColor"/>
          <g fill="none" stroke="#f9e2ba" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
            <path d="M27 12v7m-7 1h14m-14 23h14m-7 1v8m-3-2h6M20 21c-10 3-10 18 0 21h14c10-3 10-18 0-21z"/>
            <path d="M23 21c-5 5-5 16 0 21m8-21c5 5 5 16 0 21m-4-21v21M15 32h24" opacity=".72"/>
          </g>
        </svg>
        <div>
          <p class="eyebrow">Spot the difference</p>
          <h1>Lantern Lane<span>.</span></h1>
        </div>
      </div>
      <dl class="stats" aria-label="Game statistics">
        <div class="stat stat-primary"><dt>Remaining</dt><dd id="remaining">7</dd></div>
        <div class="stat"><dt>Found</dt><dd id="found">0<span>/7</span></dd></div>
        <div class="stat"><dt>Time</dt><dd id="time">0:00</dd></div>
        <div class="stat"><dt>Misses</dt><dd id="misses">0</dd></div>
      </dl>
    </header>

    <section class="board" aria-label="Compare the night market pictures">
      <figure class="panel panel-original">
        <figcaption><span class="panel-dot" aria-hidden="true"></span><span id="original-label">Original</span></figcaption>
        <div class="picture"><svg id="original" role="img" aria-labelledby="original-label"></svg></div>
      </figure>
      <figure class="panel panel-changed">
        <figcaption><span class="panel-dot" aria-hidden="true"></span><span id="changed-label">Changed</span></figcaption>
        <div class="picture"><svg id="changed" role="img" aria-labelledby="changed-label"></svg></div>
      </figure>
      <div class="intro" id="intro" aria-labelledby="intro-title">
        <div class="intro-card">
          <svg class="intro-moon" viewBox="0 0 70 36" aria-hidden="true">
            <path d="M2 27h66M12 32h13m20 0h13" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
            <path d="M22 27v-3a13 13 0 0 1 26 0v3z" fill="#e8a748"/>
            <path d="M35 4v4m-19 4 3 3m35-3-3 3M8 19v5m-2.5-2.5h5m51-2.5v5m-2.5-2.5h5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <h2 id="intro-title">Find 7 differences</h2>
          <p>Two views of the night market.<br>Pick out what changed in either picture.</p>
          <button type="button" id="start" class="button button-primary">Start <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <footer class="toolbar">
      <div class="guidance" id="guidance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v5m0 11v5M1.5 12h5m11 0h5"/><circle cx="12" cy="12" r="1.5"/></svg>
        <p>Select a difference in either picture.</p>
      </div>
      <div class="result" id="result" hidden>
        <strong>All 7 found!</strong>
        <span id="result-details"></span>
      </div>
      <div class="actions" id="actions">
        <button type="button" class="button button-outline" id="hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.8 6 3.4 8.8 9 10-5.6 1.2-8.2 4-9 10-.8-6-3.4-8.8-9-10 5.6-1.2 8.2-4 9-10Z"/></svg>
          Hint <span id="hint-count" class="hint-count">3</span><kbd>H</kbd>
        </button>
        <button type="button" class="button button-outline" id="restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 1.9 6.4M4 5v6h6"/></svg>
          Restart <kbd>R</kbd>
        </button>
      </div>
      <button type="button" id="again" class="button button-primary" hidden>Play again <span aria-hidden="true">→</span></button>
    </footer>
    <p class="sr-only" id="announcement" role="status"></p>
  </main>
  <script>
    // Desktop Chrome permits local classic scripts when index.html is opened directly.
    if (location.protocol === 'file:') {
      const script = document.createElement('script');
      script.src = './offline.js';
      document.body.append(script);
    } else {
      import('./src/main.mjs');
    }
  </script>
</body>
</html>
